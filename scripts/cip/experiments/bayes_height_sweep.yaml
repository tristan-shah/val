# Bayesian optimization of triple-pendulum tip height.
#
# Usage:
#   wandb sweep scripts/cip/experiments/height_sweep.yaml
#   wandb agent <ENTITY>/val-scripts_cip_experiments/<SWEEP_ID>
#
program: scripts/cip/experiments/triple_pendulum_wandb.py

method: bayes

metric:
  name: height_last10
  goal: maximize

# Stop after this many evaluations.
# Increase if you have more compute.
run_cap: 60

command:
  - ${env}
  - ${interpreter}
  - ${program}

parameters:
  # Fixed parameters
  gear:
    value: 25.0

  damping:
    value: 3.5

  steps:
    value: 1200

  seed:
    value: 0

  component:
    value: ol

  # Discrete search space
  horizon:
    values:
      - 128
      - 256
      - 512

  shots:
    values:
      - 512
      - 1024
      - 2048

  iterations:
    values:
      - 1
      - 5
      - 10

  # Continuous search space
  elite_frac:
    distribution: uniform
    min: 0.05
    max: 0.30

  beta:
    distribution: uniform
    min: 0.0
    max: 5.0